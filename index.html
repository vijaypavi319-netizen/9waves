<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 Waves Restaurant</title>
<style>
:root{--theme:#6b4049;--bg:#fff8f0;--ink:#2a1f22;--card:#fff;--muted:#7a6a6e}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg) center/cover fixed no-repeat;min-height:100vh}
header{background:var(--theme);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:1.3rem;cursor:pointer;user-select:none}header small{opacity:.85}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--theme);color:#fff;font-size:.95rem}
.btn.alt{background:#eee;color:var(--ink)}.btn.dark{background:#111827}.btn.go{background:#e8590c}.btn.del{background:#b42318}.btn.ok{background:#15803d}
.hero{background:linear-gradient(135deg,var(--theme),#f59f0b);color:#fff;padding:26px 18px 56px;border-radius:0 0 40px 40px}
.hero h2{margin:0 0 8px;font-size:1.8rem}.hero p{margin:0;opacity:.95}
.tabs{display:flex;background:#fff;margin:-34px 14px 14px;border-radius:20px;padding:6px;box-shadow:0 4px 14px #0002;position:relative}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font-weight:700;font-size:.95rem;border-radius:14px;cursor:pointer}
.tabs button.on{background:#fdebd3}
.badge{background:var(--theme);color:#fff;border-radius:10px;padding:1px 7px;font-size:.8rem}
main{padding:0 14px 40px;max-width:760px;margin:auto}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
.card img.dish{width:100%;height:210px;object-fit:cover;border-radius:14px;background:#f1e7dc}
.noimg{height:140px;border-radius:14px;background:#f1e7dc;display:grid;place-items:center;font-size:3rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cat{color:#e8590c;font-weight:700;font-size:.9rem}.price{font-weight:800;font-size:1.2rem}
.desc{color:var(--muted);margin:4px 0 10px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:14px;font-size:1rem;margin:5px 0;background:#fff}
.inline{display:flex;gap:8px}.inline select{width:90px}.inline input{flex:1}
.status{display:inline-block;padding:3px 10px;border-radius:10px;font-weight:700;font-size:.85rem;background:#fde68a}
.paid{background:#bbf7d0}.pend{background:#fecaca}
.empty{text-align:center;color:var(--muted);padding:30px}
.qrbox{display:inline-block;padding:12px;background:#fff;border-radius:12px;border:1px solid #eee}
.paybox{background:#fff7ed;border:1px solid #fed7aa;border-radius:16px;padding:14px;text-align:center;margin-top:10px}
.payamt{font-size:1.6rem;font-weight:800;color:#e8590c;margin:0}
.steps{text-align:left;margin:8px 0;padding-left:20px;line-height:1.6}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
#sync{font-size:.75rem;opacity:.9}
</style>
</head>
<body>
<header>
  <div><h1 id="logo">🌊 9 Waves</h1><small>Fresh • Fusion • Live</small> <small id="sync">connecting…</small></div>
  <button class="btn dark" id="adminBtn" style="display:none">Logout Admin</button>
</header>
<section class="hero">
  <h2>Crafted Flavors, Served Fresh at Your Table.</h2>
  <p>Order directly from our live kitchen menu &amp; pay via UPI or at the stall.</p>
</section>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
"use strict";

/* ====== SETTINGS ====== */
var ADMIN_PIN = "9waves";            // CHANGE THIS
var UPI_ID = "8884275689@axl";
var PAYEE_NAME = "PAVITHRA H R";
var FIREBASE_CONFIG = { databaseURL: "https://waves-restaurant-default-rtdb.firebaseio.com" };

/* ====== STATE ====== */
var menu = {}, orders = {}, settings = {}, reviews = {};
var tab = "menu";
var isAdmin = false;
try { isAdmin = sessionStorage.getItem("isAdmin") === "1"; } catch(e){}
function load(k){ try { var v = JSON.parse(localStorage.getItem(k) || "[]"); return Array.isArray(v) ? v : []; } catch(e){ return []; } }
var cart = load("w9_cart"), myOrders = load("w9_orders");
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; setTimeout(function(){ t.style.display = "none"; }, 2200); }

/* ====== FIREBASE ====== */
firebase.initializeApp(FIREBASE_CONFIG);
var db = firebase.database();

db.ref(".info/connected").on("value", function(s){
  document.getElementById("sync").textContent = s.val() ? "● live" : "○ offline";
});
db.ref("menu").on("value", function(s){
  if (s.val() === null && !window.__seeded) { window.__seeded = true; seedMenu(); }
  menu = s.val() || {}; render();
}, function(e){ toast("Database error: " + e.message); });
db.ref("orders").on("value", function(s){ orders = s.val() || {}; render(); });
db.ref("settings").on("value", function(s){ settings = s.val() || {}; applyTheme(); render(); });
db.ref("reviews").on("value", function(s){ reviews = s.val() || {}; render(); });

function seedMenu(){
  db.ref("menu").push({name:"Rainbow Pinwheel Sandwiches",cat:"Savory",price:80,desc:"Bread, cucumber, carrot, beetroot, paneer spread, and lettuce rolled together.",img:""});
  db.ref("menu").push({name:"Sev Bhaji",cat:"Savory",price:80,desc:"Crunchy sev with spicy bhaji.",img:""});
}

function applyTheme(){
  document.documentElement.style.setProperty("--theme", settings.theme || "#6b4049");
  document.body.style.backgroundImage = settings.bg ? "url(" + settings.bg + ")" : "none";
}

/* ====== HELPERS ====== */
function siteUrl(){ return (location.origin + location.pathname).replace(/index\.html$/, ""); }
/* QR holds only UPI ID + name (no amount / note) */
function upiLink(){ return "upi://pay?pa=" + encodeURIComponent(UPI_ID) + "&pn=" + encodeURIComponent(PAYEE_NAME) + "&cu=INR"; }
function makeQRs(){
  if (typeof QRCode === "undefined") return;
  var boxes = document.querySelectorAll("[data-qr]");
  for (var i = 0; i < boxes.length; i++){
    var el = boxes[i];
    el.innerHTML = "";
    new QRCode(el, { text: el.dataset.qr === "site" ? siteUrl() : upiLink(), width: 200, height: 200 });
  }
}
function compress(file, maxW, q, cb){
  var r = new FileReader();
  r.onload = function(){
    var im = new Image();
    im.onload = function(){
      var sc = Math.min(1, maxW / im.width), c = document.createElement("canvas");
      c.width = im.width * sc; c.height = im.height * sc;
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", q));
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}
function copyText(t, msg){
  try { navigator.clipboard.writeText(t); toast(msg); } catch(e){ toast(t); }
}

/* ====== RENDER ====== */
function renderTabs(){
  var t = [["menu","🍽️ Menu"],["cart","🛒 Cart <span class='badge'>" + cart.length + "</span>"],["orders","📦 Orders"]];
  if (isAdmin) t.push(["kitchen","👨‍🍳 Kitchen"]);
  document.getElementById("tabs").innerHTML = t.map(function(x){
    return "<button data-tab='" + x[0] + "' class='" + (tab === x[0] ? "on" : "") + "'>" + x[1] + "</button>";
  }).join("");
  document.getElementById("adminBtn").style.display = isAdmin ? "inline-block" : "none";
}

function render(){
  var a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && document.getElementById("view").contains(a)) return;
  renderTabs();
  var v = document.getElementById("view");
  if (tab === "menu") v.innerHTML = (isAdmin ? adminPanel() : "") + menuHTML();
  else if (tab === "cart") v.innerHTML = cartHTML();
  else if (tab === "orders") v.innerHTML = ordersHTML();
  else if (tab === "kitchen" && isAdmin) v.innerHTML = kitchenHTML();
  makeQRs();
}

function adminPanel(){
  return "<div class='card'><h3>🎨 Customize Theme &amp; Background</h3>" +
    "<div class='row'><b>Theme Color:</b><input type='color' id='themeColor' value='" + esc(settings.theme || "#6b4049") + "' style='width:70px'>" +
    "<button class='btn' data-act='applyTheme'>Apply</button><button class='btn alt' data-act='resetTheme'>Reset</button></div>" +
    "<p><b>🖼️ Background photo:</b><input type='file' accept='image/*' id='bgFile'></p>" +
    "<p><b>📲 Your own PhonePe/GPay QR photo (recommended):</b><br><small>In PhonePe tap your profile → My QR, screenshot it and upload here. If you skip this, a QR is made from " + esc(UPI_ID) + "</small>" +
    "<input type='file' accept='image/*' id='qrFile'>" + (settings.qr ? "<button class='btn del' data-act='delQr'>Remove uploaded QR</button>" : "") + "</p><hr>" +
    "<h3>🪧 Stall QR (opens this website)</h3><p><small>Take a screenshot of this QR and stick it at your stall.</small></p>" +
    "<div style='text-align:center'><div class='qrbox' data-qr='site'></div><p><small>" + esc(siteUrl()) + "</small></p></div><hr>" +
    "<h3>+ Add New Dish</h3>" +
    "<input id='dName' placeholder='Dish Name'><input id='dCat' placeholder='Category (Savory/Dessert/Beverage)'>" +
    "<input id='dPrice' type='number' placeholder='Price ₹'><textarea id='dDesc' rows='2' placeholder='Description'></textarea>" +
    "<input type='file' accept='image/*' id='dImg'><button class='btn go' style='width:100%;margin-top:8px' data-act='addDish'>Add Dish</button></div>";
}

function menuHTML(){
  var ids = Object.keys(menu);
  if (!ids.length) return "<div class='empty'>No dishes yet.</div>";
  return ids.map(function(id){
    var d = menu[id], rv = reviews[id] ? Object.keys(reviews[id]).map(function(k){ return reviews[id][k]; }) : [];
    var avg = rv.length ? (rv.reduce(function(s,r){ return s + r.stars; }, 0) / rv.length).toFixed(1) : "New";
    return "<div class='card'>" + (d.img ? "<img class='dish' src='" + d.img + "' alt='" + esc(d.name) + "'>" : "<div class='noimg'>🍴</div>") +
      "<div class='row' style='margin-top:10px'><span class='cat'>" + esc(d.cat) + "</span><span class='price'>₹" + esc(d.price) + "</span></div>" +
      "<h3 style='margin:4px 0'>" + esc(d.name) + "</h3><p class='desc'>" + esc(d.desc) + "</p>" +
      "<div class='row'><b style='color:#e8590c'>⭐ " + avg + " (" + rv.length + ")</b>" +
      "<span>" + (isAdmin ? "<button class='btn del' data-act='delDish' data-id='" + id + "'>Delete</button> " : "") +
      "<button class='btn go' data-act='addCart' data-id='" + id + "'>+ Add</button></span></div>" +
      "<div class='inline' style='margin-top:10px'><select id='st_" + id + "'><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>" +
      "<input id='rv_" + id + "' placeholder='Add review...'><button class='btn dark' data-act='postReview' data-id='" + id + "'>Post</button></div></div>";
  }).join("");
}

function cartTotal(){ return cart.reduce(function(s,c){ return s + Number(c.price) * c.qty; }, 0); }

function cartHTML(){
  if (!cart.length) return "<div class='card empty'>Your cart is empty. Add dishes from the menu.</div>";
  var total = cartTotal();
  return "<div class='card'>" + cart.map(function(c,i){
    return "<div class='row' style='margin-bottom:8px'><span>" + esc(c.name) + " × " + c.qty + "</span><span><b>₹" + (c.price * c.qty) + "</b> <button class='btn alt' data-act='rmCart' data-i='" + i + "'>✕</button></span></div>";
  }).join("") + "<hr><div class='row'><b>Total</b><b class='price'>₹" + total + "</b></div>" +
  "<input id='cName' placeholder='Your name'><input id='cTable' placeholder='Table number / Stall'>" +
  "<select id='cPay'><option value='UPI'>Pay via UPI</option><option value='Stall'>Pay at the stall</option></select>" +
  "<div class='paybox'><p class='payamt'>Pay ₹" + total + "</p>" +
  "<ol class='steps'><li>Tap <b>Copy UPI ID</b> (or scan the QR below with another phone).</li>" +
  "<li>Open PhonePe / GPay / Paytm → <b>Pay to UPI ID</b> → paste it.</li>" +
  "<li>Enter amount <b>₹" + total + "</b> and pay.</li>" +
  "<li>Type the Transaction ID below and tap Place Order.</li></ol>" +
  "<p style='margin:6px 0'>UPI ID: <b>" + esc(UPI_ID) + "</b></p>" +
  "<p><button class='btn alt' data-act='copyUpi'>Copy UPI ID</button> <button class='btn alt' data-act='copyAmt'>Copy amount</button></p>" +
  (settings.qr ? "<img src='" + settings.qr + "' style='max-width:240px;width:100%;border-radius:12px'>" : "<div class='qrbox' data-qr='upi'></div>") +
  "<input id='cUtr' placeholder='Transaction ID / UTR (after paying)'></div>" +
  "<button class='btn go' style='width:100%;margin-top:12px' data-act='placeOrder'>Place Order</button></div>";
}

function ordersHTML(){
  var mine = myOrders.filter(function(id){ return orders[id]; });
  if (!mine.length) return "<div class='card empty'>No orders from this device yet.</div>";
  return mine.slice().reverse().map(function(id){ return orderCard(id, false); }).join("");
}

function kitchenHTML(){
  var ids = Object.keys(orders).sort(function(a,b){ return (orders[b].ts||0) - (orders[a].ts||0); });
  if (!ids.length) return "<div class='card empty'>No orders yet.</div>";
  return ids.map(function(id){ return orderCard(id, true); }).join("");
}

function orderCard(id, kitchen){
  var o = orders[id];
  var items = (o.items || []).map(function(i){ return esc(i.name) + " × " + i.qty; }).join(", ");
  var paidTag = o.paid ? "<span class='status paid'>✅ Paid</span>" : "<span class='status pend'>⏳ Payment pending</span>";
  var btns = kitchen ? ["New","Preparing","Ready","Served"].map(function(s){
    return "<button class='btn " + (o.status === s ? "go" : "alt") + "' data-act='setStatus' data-id='" + id + "' data-s='" + s + "'>" + s + "</button>";
  }).join(" ") + (o.paid ? "" : " <button class='btn ok' data-act='setPaid' data-id='" + id + "'>Mark paid</button>") +
  " <button class='btn del' data-act='delOrder' data-id='" + id + "'>🗑</button>" : "";
  return "<div class='card'><div class='row'><b>" + esc(o.name) + " • " + esc(o.table) + "</b><span class='status'>" + esc(o.status) + "</span></div>" +
    "<p>" + items + "</p><div class='row'><span>" + esc(o.pay) + " • " + new Date(o.ts).toLocaleString() + "</span><b>₹" + esc(o.total) + "</b></div>" +
    "<p style='margin:8px 0 0'>" + paidTag + (o.utr ? " &nbsp;UTR: <b>" + esc(o.utr) + "</b>" : "") + "</p>" +
    (btns ? "<div style='margin-top:10px;display:flex;gap:6px;flex-wrap:wrap'>" + btns + "</div>" : "") + "</div>";
}

/* ====== ACTIONS ====== */
var actions = {
  applyTheme: function(){ db.ref("settings/theme").set(document.getElementById("themeColor").value); toast("Theme applied"); },
  resetTheme: function(){ db.ref("settings/theme").set("#6b4049"); db.ref("settings/bg").remove(); toast("Theme reset"); },
  delQr: function(){ db.ref("settings/qr").remove(); toast("Uploaded QR removed"); },
  copyUpi: function(){ copyText(UPI_ID, "UPI ID copied"); },
  copyAmt: function(){ copyText(String(cartTotal()), "Amount copied"); },
  addDish: function(){
    var name = val("dName"), price = val("dPrice");
    if (!name || !price) return toast("Enter dish name and price");
    var f = document.getElementById("dImg").files[0];
    var push = function(img){
      db.ref("menu").push({name:name, cat:val("dCat") || "Savory", price:Number(price), desc:val("dDesc"), img:img || ""})
        .then(function(){ toast("Dish added"); }).catch(function(e){ toast(e.message); });
      ["dName","dCat","dPrice","dDesc"].forEach(function(i){ document.getElementById(i).value = ""; });
      document.getElementById("dImg").value = "";
    };
    f ? compress(f, 700, 0.7, push) : push("");
  },
  delDish: function(el){ if (confirm("Delete this dish?")) db.ref("menu/" + el.dataset.id).remove(); },
  addCart: function(el){
    var id = el.dataset.id, d = menu[id], f = cart.filter(function(c){ return c.id === id; })[0];
    if (!d) return;
    if (f) f.qty++; else cart.push({id:id, name:d.name, price:d.price, qty:1});
    save("w9_cart", cart); renderTabs(); toast("Added to cart");
  },
  rmCart: function(el){ cart.splice(Number(el.dataset.i), 1); save("w9_cart", cart); render(); },
  postReview: function(el){
    var id = el.dataset.id, txt = document.getElementById("rv_" + id).value.trim();
    db.ref("reviews/" + id).push({stars:Number(document.getElementById("st_" + id).value), text:txt, ts:Date.now()});
    document.getElementById("rv_" + id).value = ""; toast("Review posted");
  },
  placeOrder: function(){
    var name = val("cName"), table = val("cTable");
    if (!name || !table) return toast("Enter your name and table");
    var ref = db.ref("orders").push();
    ref.set({name:name, table:table, pay:document.getElementById("cPay").value, utr:val("cUtr"), paid:false, items:cart, total:cartTotal(), status:"New", ts:Date.now()})
      .then(function(){
        myOrders.push(ref.key); save("w9_orders", myOrders);
        cart = []; save("w9_cart", cart); tab = "orders"; render(); toast("Order placed!");
      }).catch(function(e){ toast("Failed: " + e.message); });
  },
  setStatus: function(el){ db.ref("orders/" + el.dataset.id + "/status").set(el.dataset.s); },
  setPaid: function(el){ db.ref("orders/" + el.dataset.id + "/paid").set(true); toast("Marked as paid"); },
  delOrder: function(el){ if (confirm("Delete this order?")) db.ref("orders/" + el.dataset.id).remove(); }
};
function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ""; }

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-tab],[data-act]");
  if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; render(); return; }
  if (actions[t.dataset.act]) actions[t.dataset.act](t);
});

document.addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  if (e.target.id === "bgFile") compress(f, 1000, 0.6, function(d){ db.ref("settings/bg").set(d); toast("Background updated"); });
  if (e.target.id === "qrFile") compress(f, 600, 0.8, function(d){ db.ref("settings/qr").set(d); toast("QR updated"); });
});

/* ====== HIDDEN ADMIN: tap the logo 5 times ====== */
var taps = 0, tapTimer;
document.getElementById("logo").addEventListener("click", function(){
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(function(){ taps = 0; }, 2500);
  if (taps >= 5){
    taps = 0;
    if (isAdmin) return;
    var p = prompt("Enter admin PIN:");
    if (p === ADMIN_PIN){ isAdmin = true; try { sessionStorage.setItem("isAdmin","1"); } catch(e){} render(); toast("Admin mode on"); }
    else if (p !== null) toast("Wrong PIN");
  }
});
document.getElementById("adminBtn").addEventListener("click", function(){
  isAdmin = false; try { sessionStorage.removeItem("isAdmin"); } catch(e){}
  if (tab === "kitchen") tab = "menu"; render();
});

render();
})();
</script>
</body>
</html>
